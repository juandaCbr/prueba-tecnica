<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>mis cursos inscritos</h2>
    <a routerLink="/dashboard" class="btn btn-secondary">volver al inicio</a>
  </div>

  <div *ngIf="mensaje" class="alert alert-danger shadow-sm">
    {{ mensaje }}
  </div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let curso of misCursos">
      <div class="card h-100 shadow-sm border-0 bg-light">
        <div class="card-body">
          <h5 class="card-title text-success">{{ curso.titulo }}</h5>
          <h6 class="card-subtitle mb-3 text-muted">instructor: {{ curso.instructor }}</h6>
          <p class="card-text">{{ curso.descripcion }}</p>
        </div>
        <div class="card-footer bg-transparent border-0 pb-3">
          <span class="badge bg-success w-100 py-2">inscrito exitosamente</span>
        </div>
      </div>
    </div>
    
    <div class="col-12" *ngIf="misCursos.length === 0">
      <div class="alert alert-warning text-center">
        aún no te has inscrito en ningún curso. ¡ve al listado y apúntate a uno!
      </div>
    </div>
  </div>
</div>
